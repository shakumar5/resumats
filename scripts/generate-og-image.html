<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OG Image - Screenshot at 1200x630</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      padding: 80px;
      position: relative;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 80px;
    }
    .logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-icon svg { width: 28px; height: 28px; }
    .logo-text { font-size: 24px; font-weight: 700; color: #1e3a8a; }
    h1 { font-size: 64px; font-weight: 800; color: #111827; line-height: 1.1; }
    h1 span { color: #2563eb; }
    .subtitle { font-size: 22px; color: #4b5563; margin-top: 24px; line-height: 1.5; }
    .badges { display: flex; gap: 16px; margin-top: 40px; }
    .badge {
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
    }
    .badge-green { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    .badge-blue { background: #dbeafe; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .badge-purple { background: #f3e8ff; color: #7c3aed; border: 1px solid #e9d5ff; }
    .url { position: absolute; bottom: 50px; left: 80px; font-size: 18px; color: #6b7280; font-weight: 500; }
    .circle1 { position: absolute; top: 50px; right: 100px; width: 300px; height: 300px; border-radius: 50%; background: #2563eb; opacity: 0.07; }
    .circle2 { position: absolute; bottom: 80px; right: 50px; width: 200px; height: 200px; border-radius: 50%; background: #3b82f6; opacity: 0.05; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="circle1"></div>
  <div class="circle2"></div>
  
  <div class="logo">
    <div class="logo-icon">
      <svg fill="none" stroke="white" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
    </div>
    <span class="logo-text">OnlineResumATS</span>
  </div>

  <h1>Beat the ATS.<br><span>Land More Interviews.</span></h1>
  
  <p class="subtitle">Free ATS Resume Tools — Score Checker, Cover Letter Generator,<br>Domain Converter & Keyword Analyzer</p>

  <div class="badges">
    <span class="badge badge-green">✓ 100% Free</span>
    <span class="badge badge-blue">🔒 Browser Only</span>
    <span class="badge badge-purple">⚡ No Sign-up</span>
  </div>

  <div class="url">onlineresumats.com</div>
</body>
</html>
